name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GJS and GLib tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict schemas

      - name: Run unit and controller regression tests
        run: |
          gjs -m tests/policyEngine.test.js
          gjs -m tests/lidController.test.js

      - name: Validate metadata.json
        run: python3 -m json.tool metadata.json >/dev/null

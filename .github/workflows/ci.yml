name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GJS, GLib, GTK4/Adwaita, and Xvfb tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin gir1.2-adw-1 gir1.2-gtk-4.0 xvfb

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict schemas

      - name: Check JS module syntax and schema
        run: make check-syntax

      - name: Run unit, integration, and preferences tests
        run: make test

      - name: Validate metadata.json
        run: python3 -m json.tool metadata.json >/dev/null
